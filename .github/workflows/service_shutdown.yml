name: TDR Run Service Shutdown
on:
  workflow_dispatch:
    inputs:
      environment:
        description: TDR environment
        type: choice
        required: true
        options:
          - dev
          - intg
          - staging
          - prod
      service-action:
        description: 'Whether shutting down or restarting TDR'
        required: true
        options:
          - Shutdown
          - Restart
        type: choice
permissions:
  contents: read
  id-token: write
jobs:
  enable-service-shutdown:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set role name
        id: role
        shell: python
        env:
          TDR_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          import os
          environment = os.environ["TDR_ENVIRONMENT"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"role-name=TDRGithubActionsDeployServiceUnavailableRole{environment.title()}", file=output)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ steps.role.outputs.role-name }}
          aws-region: eu-west-2
          role-session-name: EnableServiceShutdown
      - name: Enable shutdown of services
        env:
          ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
          TDR_ENVIRONMENT: ${{ inputs.environment }}
          SERVICE_ACTION: ${{ inputs.service-action }}
        run: |
          python -m pip install boto3
          python .github/scripts/enable_maintenance.py \
            --account "$ACCOUNT_NUMBER" \
            --environment "$TDR_ENVIRONMENT" \
            --service_action "$SERVICE_ACTION"
      - name: Send failure message
        if: failure()
        uses: nationalarchives/tdr-github-actions/.github/actions/slack-send@5a96b84cf82bce1371168cc31cb89f88cad86763 # v0.0.53
        with:
          message: ":warning: *Service Shutdown* - ${{ github.event.inputs.service-action }} has failed for environment ${{ github.event.inputs.environment }}"
          slack-url: ${{ secrets.SLACK_WEBHOOK }}
      - name: Send success message for service shutdown
        uses: nationalarchives/tdr-github-actions/.github/actions/slack-send@5a96b84cf82bce1371168cc31cb89f88cad86763 # v0.0.53
        with:
          message: "*Service Shutdown* - ${{ github.event.inputs.service-action }} has succeeded for ${{ github.event.inputs.environment }}."
          slack-url: ${{ secrets.SLACK_WEBHOOK }}
