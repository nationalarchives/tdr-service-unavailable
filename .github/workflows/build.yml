name: TDR Tag and pre deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
          - dev
          - drdev
        default: 'intg'
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
permissions: {}
jobs:
  pre-deploy:
    permissions: { contents: write, id-token: write }
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@714115ab533f9f6b0b4fed5a4293e9d57c2b89d8 # v0.0.53
    with:
      lambda-name: service-unavailable
      repo-name: tdr-service-unavailable
      artifact-name: deployment
      artifact-file-type: zip
      artifact-path: .
      snapshot: ${{ inputs.snapshot == true }}
      build-command: |
        npm ci
        npm run build-css
        ./create_deployment_package.sh
      environment: ${{ inputs.environment }}
      account-regional-code-bucket: true
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  deploy:
    permissions: { contents: write, id-token: write }
    needs: pre-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - run: |
          gh workflow run deploy.yml --ref "$WORKFLOW_REF" \
            -f environment=drdev \
            -f to-deploy=${NEXT_VERSION}
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          WORKFLOW_REF: ${{ github.ref_name }}
