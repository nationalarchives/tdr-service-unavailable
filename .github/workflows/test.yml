name: TDR Run Lambda Tests
on:
  pull_request:
  push:
    branches-ignore:
      - master
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@4b2753940019ebbed38030f1aca49f0eb123a45e # v0.0.55
    with:
      repo-name: tdr-service-unavailable
      test-command: |
        pip install -r requirements.txt
        python -m pytest test
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
